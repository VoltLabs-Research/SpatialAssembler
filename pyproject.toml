[build-system]
requires = ["setuptools>=64", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "volt-spatial-assembler"
version = "1.0.1"
description = "Encoder and decoder of the quantized, meshopt-compressed glTF models VOLT stores (shared C++ core with the Node addon)."
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools]
packages = ["volt_spatial_assembler"]
